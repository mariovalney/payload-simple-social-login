name: Publish

# Trusted Publishing (OIDC): https://docs.npmjs.com/trusted-publishers
# Provenance is automatic with OIDC — no NPM_TOKEN.
# (The provenance docs example that uses secrets.NPM_TOKEN is the older token-based path.)

on:
  release:
    types: [published]

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Trusted Publishing: Node >= 22.14, npm >= 11.5.1
          node-version: '22.14'
          registry-url: https://registry.npmjs.org
          cache: pnpm
          package-manager-cache: false

      - name: Ensure npm CLI for OIDC
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release tag matches package.json version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v${VERSION}" ]; then
            echo "Release tag '${TAG}' must equal 'v${VERSION}' (package.json version)."
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Integration tests
        run: pnpm test:int

      # OIDC auth — do not set NODE_AUTH_TOKEN (empty token breaks trusted publish).
      # Provenance is generated automatically with Trusted Publishing.
      - name: Publish
        run: npm publish --access public
